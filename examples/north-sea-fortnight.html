  <style>
    :root { --sidebar-w: 360px; --sheet-peek: 168px; --sheet-offset: 0px; }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
    #map { position: absolute; inset: 0; z-index: 1; background: #dfeef2; }

    #sidebar {
      width: var(--sidebar-w);
      max-width: 92vw;
      transition: transform .28s ease, margin-left .28s ease;
    }
    .sheet-handle { display: none; width: 100%; padding: 8px 0 4px; border: 0; background: transparent; cursor: grab; touch-action: none; }
    .sheet-handle span { display: block; width: 40px; height: 4px; margin: 0 auto; border-radius: 999px; background: rgba(15, 79, 93, .22); }

    @media (max-width: 767px) {
      #sidebar {
        position: fixed; left: 0; right: 0; bottom: 0; top: auto;
        width: 100%; max-width: none; height: min(78vh, 720px);
        z-index: 1200; border-radius: 18px 18px 0 0; border-right: 0;
        border-top: 1px solid rgba(11, 59, 79, .08);
        box-shadow: 0 -12px 32px rgba(11, 59, 79, .16);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #sidebar.is-open { transform: translateY(0); }
      #sidebar.is-peek { transform: translateY(calc(100% - var(--sheet-peek))); }
      #sidebar.is-collapsed { transform: translateY(110%); }
      #sidebar header { padding-top: 0; }
      .sheet-handle { display: block; }
      #backdrop { transition: opacity .28s ease; }
      #legend, #tour-bar { bottom: calc(var(--sheet-offset) + 12px); }
      .leaflet-bottom.leaflet-right { margin-bottom: calc(var(--sheet-offset) + 8px) !important; }
    }
    @media (min-width: 768px) {
      #sidebar { position: relative; flex-shrink: 0; height: 100%; transform: none; }
      #sidebar.is-collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
      #backdrop { display: none !important; }
    }

    .thin-scroll { overscroll-behavior: contain; }
    .thin-scroll::-webkit-scrollbar { width: 5px; }
    .thin-scroll::-webkit-scrollbar-thumb { background: rgba(15, 79, 93, .18); border-radius: 9999px; }

    .leaflet-popup-content-wrapper {
      border-radius: 12px; padding: 0; overflow: hidden;
      box-shadow: 0 12px 32px -12px rgba(11, 59, 79, .35);
      border: 1px solid rgba(11, 59, 79, .08);
    }
    .leaflet-popup-content { margin: 0; line-height: 1.45; max-width: calc(100vw - 64px); }
    .leaflet-container a.leaflet-popup-close-button {
      top: 6px; right: 6px; width: 24px; height: 24px; line-height: 22px;
      border-radius: 9999px; color: #64748b; font-size: 17px; text-align: center;
    }
    .leaflet-container a.leaflet-popup-close-button:hover { background: #f1f5f9; color: #0f172a; }
    .leaflet-container { font-family: 'Inter', system-ui, sans-serif; }
    .leaflet-tooltip.stop-tip {
      border-radius: 6px; padding: 2px 7px; font-weight: 500; font-size: 11px; color: #0b3b4f;
      border: 0; box-shadow: 0 2px 8px rgba(11, 59, 79, .18);
    }

    .wp { position: relative; width: 26px; height: 26px; }
    .wp-dot {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      border-radius: 9999px; background: #fff; font-weight: 600; font-size: 11px;
      border: 2.5px solid currentColor; box-shadow: 0 2px 6px rgba(11, 59, 79, .25);
      transition: transform .18s ease;
    }
    .wp-dot.is-filled { color: #fff !important; }
    .wp-dot.is-idea { border-style: dashed; }
    .leaflet-marker-icon:hover .wp-dot, .wp.is-active .wp-dot { transform: scale(1.18); }
    .wp-ring {
      position: absolute; inset: -4px; border-radius: 9999px; border: 2px solid currentColor;
      pointer-events: none; animation: ring 1.8s ease-out infinite;
    }
    .wp-heart {
      position: absolute; top: -6px; right: -7px; width: 16px; height: 16px; border-radius: 9999px;
      background: #fff; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(11, 59, 79, .25);
    }
    @keyframes ring { 0% { transform: scale(.9); opacity: .7; } 80%, 100% { transform: scale(1.6); opacity: 0; } }

    .arrow-icon, .vehicle-icon { pointer-events: none; }
    .arrow-icon > div, .vehicle-icon > div {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    }
    .leaflet-bottom.leaflet-right .leaflet-control-zoom {
      margin-bottom: 10px; margin-right: 10px; border: 0; box-shadow: 0 2px 8px rgba(11, 59, 79, .18);
    }
    .leaflet-control-zoom a { color: #0b3b4f; }
    .leaflet-control-scale { border: 0; }

    .tl-item.is-active { background: #eef7f9; box-shadow: inset 2px 0 0 #146272; }

    .chip {

    .chip[aria-pressed="false"] { background: #fff; border-color: #e2e8f0; color: #94a3b8; }
    .view-btn {

    .filter-select {

    }
    .hi-btn {
      display: flex; width: 100%; text-align: left; align-items: center; gap: 8px;
      margin-top: 10px; padding: 7px 10px; border-radius: 12px; cursor: pointer;
      background: #fbf7ef; border: 1px solid #f4ead5; color: #0b3b4f;
    }
    .tb-btn {
      padding: 6px; border: 0; border-radius: 8px; background: transparent; color: #64748b; cursor: pointer;
    }
    .tb-btn:hover { background: #eef7f9; color: #0b3b4f; }

    .tb-btn:disabled:hover { background: transparent; color: #64748b; }
    button:focus-visible, a:focus-visible, select:focus-visible {

    .export-btn:hover { background: #eef7f9; }

    @media (prefers-reduced-motion: reduce) {

      </div>

<script>
/*

(function () {

  }

  var PLANE = 'M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z';

    plane: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + PLANE + '"/></svg>',
    ferry: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15l2-6h14l2 6M4 15c1.4 1.6 2.5 2.2 4 2.2S10.6 16.4 12 15c1.4 1.4 2.5 2.2 4 2.2s2.6-.6 4-2.2M12 4v5"/></svg>',
    train: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7 4h10a2 2 0 012 2v8a3 3 0 01-3 3H8a3 3 0 01-3-3V6a2 2 0 012-2zM8 17l-2 3m10-3l2 3M8 9h8"/></svg>',
    car: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l1.6-4.5h10.8L19 13M5 13h14v4H5zM7.5 17.5v1M16.5 17.5v1"/></svg>',
    bus: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6 4h12a1 1 0 011 1v11H5V5a1 1 0 011-1zM5 10h14M7 19v1M17 19v1"/></svg>',
    walk: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5a2 2 0 11-4 0 2 2 0 014 0zM9 22l2-7 2 2 2 5M10 10l-2 4h4l3 3"/></svg>',
    idea: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2M5.6 5.6l1.4 1.4M3 12h2M19 12h2M17 7l1.4-1.4M9 18h6M10 21h4M12 7a5 5 0 00-3 9h6a5 5 0 00-3-9z"/></svg>',
    stay: '<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M3 18v-6a2 2 0 012-2h14a2 2 0 012 2v6M3 18h18M7 10V7h4v3"/></svg>'
  };

  /* Built-in transport styles. TRIP.modeStyles can override or add a mode. */
  var MODE_DEFAULTS = {
    flight: { label: 'Flights', name: 'Flight', color: '#0f4f5d', hi: '#0b3b4f', dash: '7 6', weight: 2.2, icon: 'plane' },
    ferry:  { label: 'Ferry', name: 'Ferry', color: '#0e7490', hi: '#155e75', dash: '9 5', weight: 3, icon: 'ferry' },
    train:  { label: 'Train', name: 'Train', color: '#1d4e89', hi: '#163a66', dash: null, weight: 3.2, icon: 'train' },
    drive:  { label: 'Road', name: 'Drive', color: '#b86a2a', hi: '#8a4e1d', dash: null, weight: 3.4, icon: 'car' },
    bus:    { label: 'Bus', name: 'Bus', color: '#3d6b7a', hi: '#0f4f5d', dash: '4 4', weight: 2.8, icon: 'bus' },
    walk:   { label: 'Walk', name: 'Walk', color: '#3f7d5a', hi: '#24543a', dash: '2 5', weight: 2.4, icon: 'walk' },
    idea:   { label: 'Optional', name: 'Optional', color: '#d9a648', hi: '#a97a22', dash: '0.5 6', weight: 2.4, icon: 'idea' }
  };
  var STATUS = {
    booked:  { label: 'Booked', color: '#d4613f', filled: true },
    base:    { label: 'Booked stay', color: '#d4613f', filled: true },
    travel:  { label: 'Travel', color: '#475569', filled: false },
    planned: { label: 'Planned', color: '#1b7a8c', filled: false },
    idea:    { label: 'Optional idea', color: '#d9a648', filled: false, dashed: true }
  };

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function safeUrl(url) {
    try {
      var u = new URL(url, window.location.href);
      if (u.protocol === 'https:' || u.protocol === 'http:') return u.href;
    } catch (e) { /* ignore bad urls */ }
    return '';
  }
  function refList(value) {
    if (!value) return [];
    var raw = Array.isArray(value) ? value : String(value).split(/\s*;\s*|\n/);
    return raw.map(function (r) { return String(r).trim(); }).filter(Boolean);
  }
  function refChips(value) {
    var refs = refList(value);
    if (!refs.length) return '';
    return '<span class="mt-1 flex flex-wrap">' + refs.map(function (r) {
      return '<span class="ref-chip">' + esc(r) + '</span>';
    }).join('') + '</span>';
  }
  function returnArcsOn() {
    var setting = TRIP.returnArcs;
    return !(setting === false || setting === 'off' || setting === 'none');
  }
  function legReturnTarget(leg) {
    if (!returnArcsOn() || !leg) return null;
    if (leg.returnTo && stopById[leg.returnTo]) return leg.returnTo;
    if (leg.returns) {
      var segs = segmentsOf(leg);
      return segs.length ? segs[0].from : null;
    }
    return null;
  }
  /* One faint arc back to a base. A white casing keeps it readable on the topo tiles. */
  function addReturnArc(group, fromId, toId, look, bendHint) {
    if (!stopById[fromId] || !stopById[toId] || fromId === toId) return null;
    var bend = typeof bendHint === 'number' ? bendHint : 0.22;
    if (bend === 0) bend = 0.22;
    var bz = makeBezier(stopById[fromId].coords, stopById[toId].coords, -Math.abs(bend));
    var halo = L.polyline(bz.latLngs, {
      pane: 'legHalo', color: '#ffffff', weight: 8, opacity: 0.95, interactive: false, lineCap: 'round'
    }).addTo(group);
    var line = L.polyline(bz.latLngs, {
      pane: 'legs', color: look.color, weight: Math.max(2.6, (look.weight || 3) - 0.3),
      opacity: 0.9, interactive: false, lineCap: 'round', lineJoin: 'round', dashArray: '2 6'
    }).addTo(group);
    return { halo: halo, line: line, latLngs: bz.latLngs };
  }

  var stopById = {};
  TRIP.stops.forEach(function (s) { stopById[s.id] = s; });
  var legById = {};
  (TRIP.legs || []).forEach(function (l) { legById[l.id] = l; });
  var dayById = {};
  (TRIP.days || []).forEach(function (d) { dayById[d.id] = d; });

  var views = (TRIP.views && TRIP.views.length) ? TRIP.views : [
    { id: 'region', label: 'The trip' },
    { id: 'full', label: 'Full route' }
  ];

  function modeStyle(id) {
    var base = MODE_DEFAULTS[id] || { label: id, name: id, color: '#1b7a8c', hi: '#0f4f5d', dash: null, weight: 3, icon: 'car' };
    var extra = (TRIP.modeStyles && TRIP.modeStyles[id]) || {};
    var out = {};
    Object.keys(base).forEach(function (k) { out[k] = base[k]; });
    Object.keys(extra).forEach(function (k) {
      if (extra[k] != null && extra[k] !== '') out[k] = extra[k];
    });
    if (!ICONS[out.icon]) out.icon = 'car';
    if (!out.name) out.name = out.label;
    return out;
  }
  function isOptional(leg) { return !!(leg && (leg.optional || leg.mode === 'idea')); }
  function appearance(leg) { return modeStyle(isOptional(leg) ? 'idea' : leg.mode); }
  function statusInfo(s) { return STATUS[s.status] || STATUS.planned; }
  function isIdeaStop(s) { return !!(s && (s.status === 'idea' || s.optional)); }

  function modeIds() {
    if (TRIP.modes && TRIP.modes.length) return TRIP.modes.slice();
    var ids = [];
    (TRIP.legs || []).forEach(function (leg) {
      var id = isOptional(leg) ? 'idea' : leg.mode;
      if (ids.indexOf(id) === -1) ids.push(id);
    });

  }
  function categoryList() {
    if (TRIP.categories && TRIP.categories.length) return TRIP.categories;
    var seen = {}, out = [];
    TRIP.stops.forEach(function (s) {
      if (s.category && !seen[s.category]) {
        seen[s.category] = true;
        out.push({ id: s.category, label: s.category });
      }
    });
    return out;
  }

  document.title = title + ' | Journey map';
  var desc = document.querySelector('meta[name="description"]');
  if (desc) desc.setAttribute('content', title + (TRIP.dates ? ', ' + TRIP.dates : '') + '. Interactive journey map.');
  el('trip-title').textContent = title;
  var subBits = [];
  if (TRIP.dates) subBits.push(TRIP.dates);
  if (TRIP.subtitle) subBits.push(TRIP.subtitle);
  el('trip-sub').textContent = subBits.join(' · ');
  el('trip-footer').textContent = TRIP.footer || 'Tap a stop or a leg.';
  var firmLegs = (TRIP.legs || []).filter(function (l) { return !isOptional(l); });
  el('stats-line').textContent = [
    ((TRIP.days || []).length || 0) + ' days',
    TRIP.stops.length + ' stops',
    firmLegs.length + ' legs'
  ].join(' · ');

  (function countdown() {
    var c = TRIP.countdown;
    if (!c || !c.start) return;
    var start = Date.parse(c.start);
    var end = c.end ? Date.parse(c.end) : start;
    if (isNaN(start)) return;
    var now = Date.now();
    var days = Math.ceil((start - now) / 86400000);
    var text = '';
    if (days > 1) text = days + ' days to go';
    else if (days === 1) text = 'Departs tomorrow';
    else if (now <= end) text = 'Trip underway';
    el('countdown').textContent = text;
  })();

  var highlight = TRIP.highlight;
  if (highlight && highlight.stopId && stopById[highlight.stopId]) {
    var hb = el('highlight-btn');
    hb.classList.remove('hidden');
    hb.innerHTML = '<svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="#d4613f" aria-hidden="true"><path d="' + HEART + '"/></svg>'
      + '<span class="min-w-0"><span class="block text-[12px] font-semibold leading-tight">' + esc(highlight.title || 'Highlight') + '</span>'
      + '<span class="block text-[11px] text-slate-500">' + esc(highlight.when || '') + '</span></span>';
  }

  /* ---------- filters ---------- */
  var filters = { modes: {}, day: 'all', category: 'all' };
  modeIds().forEach(function (id) { filters.modes[id] = true; });
  var viewMode = TRIP.defaultView || views[0].id || 'region';

  function fillSelect(select, options, allLabel) {
    select.innerHTML = '';
    var all = document.createElement('option');
    all.value = 'all';
    all.textContent = allLabel;
    select.appendChild(all);
    options.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt.id;
      o.textContent = opt.label;
      select.appendChild(o);
    });
  }
  fillSelect(el('filter-day'), (TRIP.days || []).map(function (d) {
    return { id: d.id, label: d.date || d.title || d.id };
  }), 'All days');
  fillSelect(el('filter-category'), categoryList(), 'All places');

  var modeWrap = el('filter-modes');
  modeIds().forEach(function (id) {

    var b = document.createElement('button');

    b.className = 'chip';
    b.dataset.mode = id;
    b.setAttribute('aria-pressed', 'true');
    var dash = style.dash ? ' stroke-dasharray="' + style.dash + '"' : '';
    b.innerHTML = '<svg width="16" height="6" aria-hidden="true"><line x1="1" y1="3" x2="15" y2="3" stroke="' + style.color + '" stroke-width="2.4" stroke-linecap="round"' + dash + '/></svg>' + esc(style.label);
    b.addEventListener('click', function () {
      filters.modes[id] = !filters.modes[id];
      syncFilterUI();
      stopTour();
      if (activeLegId && !legPasses(legById[activeLegId])) map.closePopup();
      applyVisibility();
    });
    modeWrap.appendChild(b);
  });

  function syncFilterUI() {
    modeWrap.querySelectorAll('.chip').forEach(function (chip) {
      chip.setAttribute('aria-pressed', String(filters.modes[chip.dataset.mode] !== false));
    });

    el('filter-category').value = filters.category;

  /* ---------- map + tiles ---------- */
  var map = L.map('map', { zoomControl: false, minZoom: 2, maxZoom: 18, zoomSnap: 0.25 });
  /*

   * last, and only on http(s) pages: from file:// the tile servers
   * answer 403 because the page sends no Referer. A keyless CARTO URL
   * returns a placeholder image, so it is never requested without a key.

   */

    } catch (e) { /* storage unavailable */ }

  })();
  var OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
  var ESRI_ATTR = 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>, sources: Esri, HERE, Garmin, USGS, FAO, NPS, METI, &copy; OpenStreetMap contributors, GIS User Community';

  map.createPane('legHalo').style.zIndex = 395;
  map.createPane('legs').style.zIndex = 400;
  map.createPane('tourLine').style.zIndex = 410;
  map.createPane('arrows').style.zIndex = 590;
  map.createPane('vehicle').style.zIndex = 640;

  /* ---------- legend (basemap note must exist before tiles) ---------- */
  var legendBody = el('legend-body');
  modeIds().forEach(function (id) {
    var style = modeStyle(id);
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    var dash = style.dash ? ' stroke-dasharray="' + style.dash + '"' : '';
    row.innerHTML = '<svg width="28" height="8" aria-hidden="true"><line x1="1" y1="4" x2="27" y2="4" stroke="' + style.color + '" stroke-width="2.6" stroke-linecap="round"' + dash + '/></svg><span>' + esc(style.name) + '</span>';
    legendBody.appendChild(row);
  });

    { swatch: 'background:#d4613f', label: 'Booked' },
    { swatch: 'background:#fff;border:2px solid #1b7a8c', label: 'Planned' },
    { swatch: 'background:#fff;border:2px dashed #d9a648', label: 'Optional idea' }
  ].forEach(function (item) {
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2';
    row.innerHTML = '<span class="w-2.5 h-2.5 rounded-full" style="' + item.swatch + '"></span><span>' + item.label + '</span>';
    legendBody.appendChild(row);
  });
  var arrowRow = document.createElement('div');
  arrowRow.className = 'flex items-center gap-2';
  arrowRow.innerHTML = '<svg width="28" height="12" viewBox="0 0 28 12" aria-hidden="true"><line x1="1" y1="6" x2="16" y2="6" stroke="#64748b" stroke-width="2"/><path d="M14 2L25 6L14 10L16.5 6Z" fill="#64748b"/></svg><span>Direction of travel</span>';
  legendBody.appendChild(arrowRow);
  var baseNote = document.createElement('p');
  baseNote.id = 'basemap-note';
  baseNote.className = 'hidden text-[10px] text-sand-600 leading-snug pt-1';
  legendBody.appendChild(baseNote);

  var tileProviders = [];
  if (cartoKey) {
    tileProviders.push({
      name: 'CARTO Voyager',
      hideNote: true,
      create: function () {
        return L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=' + encodeURIComponent(cartoKey), {
          attribution: OSM_ATTR + ' &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 20
        });
      }
    });
  }
  tileProviders.push({
    name: 'Esri World Topo',
    create: function () {
      return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: ESRI_ATTR,
        maxNativeZoom: 18,
        maxZoom: 19

    }
  });

    name: 'Esri World Street',
    create: function () {
      return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: ESRI_ATTR,
        maxNativeZoom: 19,
        maxZoom: 19
      });
    }
  });

    tileProviders.push({
      name: 'OpenStreetMap',
      create: function () {
        return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: OSM_ATTR,
          maxZoom: 19
        });
      }

  var activeTiles = null;
  function useTileProvider(i) {
    if (activeTiles) {
      map.removeLayer(activeTiles);
      activeTiles = null;
    }

      baseNote.textContent = 'Map tiles could not load. Check the connection and reload.';
      baseNote.classList.remove('hidden');

    }

    var layer = provider.create();
    var loads = 0;
    var errors = 0;
    var gaveUp = false;

      if (gaveUp || activeTiles !== layer) return;

        gaveUp = true;
        console.warn('Journey map: ' + provider.name + ' tiles failed to load. Trying the next basemap.');
        useTileProvider(i + 1);
      }
    }
    layer.on('tileload', function () { loads += 1; });
    layer.on('tileerror', function () { errors += 1; failOver(); });
    layer.addTo(map);
    activeTiles = layer;
    if (provider.hideNote) {
      baseNote.textContent = '';
      baseNote.classList.add('hidden');
    } else {

      baseNote.classList.remove('hidden');

  useTileProvider(0);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.control.scale({ position: 'bottomright', imperial: false, maxWidth: 120 }).addTo(map);

  var legendOpen = false;
  function setLegendOpen(open) {
    legendOpen = open;
    legendBody.classList.toggle('hidden', !open);
    el('legend-chevron').style.transform = open ? '' : 'rotate(-90deg)';
    el('btn-legend').setAttribute('aria-expanded', String(open));
  }
  el('btn-legend').addEventListener('click', function () { setLegendOpen(!legendOpen); });

  /* ---------- geometry ---------- */
  var PROJ = L.CRS.EPSG3857.projection;
  function makeBezier(fromLL, toLL, k) {

      return L.point(u * u * p0.x + 2 * u * t * c.x + t * t * p2.x, u * u * p0.y + 2 * u * t * c.y + t * t * p2.y);

      return Math.atan2(-ty, tx) * 180 / Math.PI;
    }
    var STEPS = 64, latLngs = [];
    for (var i = 0; i <= STEPS; i++) latLngs.push(PROJ.unproject(at(i / STEPS)));
    return { angle: angle, latLngAt: function (t) { return PROJ.unproject(at(t)); }, latLngs: latLngs, steps: STEPS };
  }

  function arrowIcon(color, size) {
    return L.divIcon({
      className: 'arrow-icon',

    var when = eventInstants(ev);
    var base = host === 'office'
      ? 'https://outlook.office.com/calendar/0/deeplink/compose'
      : 'https://outlook.live.com/calendar/0/deeplink/compose';
    var q = new URLSearchParams();
    q.set('path', '/calendar/action/compose');
    q.set('rru', 'addevent');
    q.set('subject', ev.title);
    if (when.allDay) {
      q.set('startdt', when.start.slice(0, 4) + '-' + when.start.slice(4, 6) + '-' + when.start.slice(6, 8));
      q.set('enddt', when.end.slice(0, 4) + '-' + when.end.slice(4, 6) + '-' + when.end.slice(6, 8));
      q.set('allday', 'true');
    } else {
      q.set('startdt', formatUtcIso(when.start));
      q.set('enddt', formatUtcIso(when.end));
      q.set('allday', 'false');
    }
    if (ev.location) q.set('location', ev.location);
    var body = descriptionOf(ev);
    if (body) q.set('body', body.slice(0, 1500));
    return base + '?' + q.toString();
  }
  function calendarLinksHtml(ev) {
    if (!ev) return '';
    return '<span class="cal-links">'
      + '<button type="button" class="ref-chip" data-cal-id="' + esc(ev.id) + '">Add to calendar</button>'
      + '<a class="ref-chip" style="background:#eef7f9;color:#146272" href="' + esc(googleUrl(ev)) + '" target="_blank" rel="noopener noreferrer">Google</a>'
      + '<a class="ref-chip" style="background:#eef7f9;color:#146272" href="' + esc(outlookUrl(ev, 'live')) + '" target="_blank" rel="noopener noreferrer">Outlook</a>'
      + '<a class="ref-chip" style="background:#eef7f9;color:#146272" href="' + esc(outlookUrl(ev, 'office')) + '" target="_blank" rel="noopener noreferrer">Outlook work</a>'
      + '</span>';
  }
  function attachCalendarCells(row, id) {
    var ev = eventById(id);
    row._google = ev ? googleUrl(ev) : '';
    row._outlook = ev ? outlookUrl(ev, 'live') : '';
    row._outlookWork = ev ? outlookUrl(ev, 'office') : '';
  }
  function downloadBlob(filename, mime, text) {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }
  function icsFor(scope) { return buildIcs(collectEvents(scope || 'timed')); }
  function downloadCalendar() {
    var scope = (el('cal-scope') && el('cal-scope').value) || 'timed';
    var events = collectEvents(scope);
    if (!events.length) { toast('No events in that set.'); return; }
    downloadBlob(tripSlug() + '.ics', 'text/calendar;charset=utf-8', buildIcs(events));
    toast('Downloaded ' + events.length + ' calendar events.');
  }

  el('btn-export').addEventListener('click', downloadTimeline);
  el('btn-copy-sheets').addEventListener('click', copyTimeline);
  el('btn-calendar').addEventListener('click', downloadCalendar);
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('[data-cal-id]');
    if (!btn) return;
    e.preventDefault();
    e.stopPropagation();
    var ev = eventById(btn.getAttribute('data-cal-id'));
    if (!ev) return;
    downloadBlob(tripSlug() + '-' + ev.fileSlug + '.ics', 'text/calendar;charset=utf-8', buildIcs([ev]));
    toast('Downloaded one calendar event.');
  });

  /* ---------- boot ---------- */
  renderSidebar();
  syncFilterUI();
  syncViewUI();
  syncPlayUI();
  setLegendOpen(false);
  if (isMobile()) setSheet('peek');
  else setSidebarOpen(true);
  map.fitBounds(boundsFor(viewMode));
  setView(viewMode, false);

  window.journeyMap = {
    map: map, setView: setView, startTour: startTour, stopTour: stopTour, goToStep: goToStep,
    selectLeg: selectLeg, focusStop: focusStop, setSheet: setSheet, filters: filters, tour: tour, legState: legState,
    timelineCsv: timelineCsv, timelineTsv: timelineTsv, guardSheetText: guardSheetText, tripSlug: tripSlug,
    icsFor: icsFor, buildIcs: buildIcs, collectEvents: collectEvents
  };
})();
</script>
</body>
</html>
